version: '3.8'

# PRODUCTION SERVER (4 vCPU / 8 GB RAM)
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'        # 2 of 4 vCPUs — leaves room for OS and backend
          memory: 512M       # nginx + static files needs very little RAM
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
