version: '3.8'

# PRODUCTION SERVER (4 vCPU / 8 GB RAM)
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
