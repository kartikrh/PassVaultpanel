version: '3.8'

# LOCAL DEVELOPMENT
# Updated: 2024-05-13
# Usage: docker compose up

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel
    restart: always
    ports:
      - "4001:3000"
    environment:
      - NODE_ENV=production
    networks:
      - panel-network

networks:
  panel-network:
    driver: bridge
