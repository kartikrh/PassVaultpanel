version: '3.8'

# LOCAL DEVELOPMENT
# Usage: docker compose up
# Hot reload enabled — code changes reflect instantly without rebuild

services:
  react-app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules    # keep container node_modules isolated from host
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true    # required for hot reload on Windows/WSL
      - NODE_OPTIONS=--max-old-space-size=4096
    command: sh -c "yarn install && yarn start"
    stdin_open: true
    tty: true
